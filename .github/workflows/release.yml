name: Release

# Push a tag v<version> matching companion/manifest.json; the package is built,
# checked and attached to a GitHub release with its checksum.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches the manifest version
        run: |
          want="v$(node -p "require('./companion/manifest.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest version $want"
            exit 1
          fi
      - run: npm run package
      - name: Checksums
        run: cd dist && sha256sum *.tgz > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## "v" " {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz dist/SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file notes.md
